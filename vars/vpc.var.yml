---
opsAccount: "{{ global_ssm_vars['/config/CKAN/opsVpcAccount'] }}"
opsRole: "{{ global_ssm_vars['/config/CKAN/opsVpcRole'] }}"
opsVpcID:  "{{ global_ssm_vars['/config/CKAN/opsVpcId'] }}"

common_stack: &common_stack
  # VPC stacks cannot be properly torn down via Ansible
  state: present
  region: "{{ region }}"
  disable_rollback: true
  template: "templates/3_tier_vpc.yml"
  template_parameters: &common_stack_template_parameters
    ApplicationName: "CKAN"
    AZCount: '3'
    BambooAgentIp: "{{ global_ssm_vars['/config/CKAN/cicdIpA'] }}"
    BambooAgentIp2: "{{ global_ssm_vars['/config/CKAN/cicdIpB'] }}"
    NatGateways: 'true'
    VPCNamePrefix: CKAN
    VPCPeeringEnabled: "{{ VPCPeeringEnabled | default('false') }} "
    VPCPeeringID: "{{ VPCPeeringID| default('') }}"
    VPCPeeringCidr: "{{ global_ssm_vars['/config/CKAN/opsVpcCidr'] }}"
  tags: &common_stack_tags
    Environment: "{{ Environment }}"
    Service: "CKAN"
    Division: "{{ Division }}"
    Owner: "{{ Owner }}"
    Version: "1.0"

cloudformation_stacks:
  - <<: *common_stack
    name: "CKAN-PROD-VPC"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: PROD
      VPCPrefix: '10.43'

  - <<: *common_stack
    name: "CKAN-STAGING-VPC"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: STAGING
      VPCPrefix: '10.42'

  - <<: *common_stack
    name: "CKAN-TRAINING-VPC"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: TRAINING
      VPCPrefix: '10.41'

  - <<: *common_stack
    name: "CKAN-DEV-VPC"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: DEV
      VPCPrefix: '10.40'
