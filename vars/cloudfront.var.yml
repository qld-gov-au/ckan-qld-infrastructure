---
template: "templates/cloudfront.cfn.yml"

cloudformation_stacks:
  - name: "{{ service_name }}-{{ Environment }}-CLOUDFRONT"
    cloudformation_waf: "CKAN-{{ Environment }}-WAF"
    state: "{{ state | default('present')}}"
    region: "{{ region }}"
    disable_rollback: 'true'
    template: "{{ template }}"
    template_jinja: "{{ template }}.j2"
    template_parameters:
      OriginReadTimeout: 180 #service increase requested, we now have 3 min wait available
      WebOrigin: "{{ environment_ssm_vars[ssm_app_prefix + '/web_loadbalancer_dns_name'] }}"
      CmsOrigin: "{{ CmsOrigin }}"
      WebACLId: "{{ lookup('aws_ssm', ssm_env_prefix + '/common/waf_acl_id', region='us-east-1') }}"
      Environment: "{{ Environment }}"
      Platform: "{{ service_name }}"
      ACMCertificateARN: "{{ ACMCertificateARNForUsEast1 }}"
      Domain: "{{ Domain }}"
      LogBucketName: "{{ global_ssm_vars['/config/CKAN/s3LogsBucket'] }}"
      AttachmentBucketName: "{{ environment_ssm_vars[ssm_app_prefix + '/s3AttachmentBucket'] }}"
      Region: "{{ region }}"
      Service: "{{ service_name }}"
      Division: "{{ Division }}"
      Owner: "{{ Owner }}"
      LambdaAtEdgeViewerRequestVersion: "{{ LambdaAtEdgeViewerRequestVersion }}"
      LambdaAtEdgeOriginRequestVersion: "{{ LambdaAtEdgeOriginRequestVersion }}"
      Version: "1.0"
    tags:
      Environment: "{{ Environment }}"
      Service: "{{ service_name }}"
      Division: "{{ Division }}"
      Owner: "{{ Owner }}"
      Version: "1.0"
