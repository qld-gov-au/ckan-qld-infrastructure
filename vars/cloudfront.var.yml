---
template: "templates/cloudfront.cfn.yml"
cloudfront_ssm_keys:
  - "{{ ssm_app_prefix }}/web_loadbalancer_dns_name"
  - /config/CKAN/s3LogsBucket
  - "{{ ssm_app_prefix }}/s3AttachmentBucket"
cloudfront_ssm_params: "{{ lookup('aws_ssm', cloudfront_ssm_keys, region=region) }}"

cloudformation_stacks:
  - name: "{{ service_name }}-{{ Environment }}-CLOUDFRONT"
    cloudformation_waf: "CKAN-{{ Environment }}-WAF"
    state: "{{ state | default('present')}}"
    region: "{{ region }}"
    disable_rollback: 'true'
    template: "{{ template }}"
    template_jinja: "{{ template }}.j2"
    template_parameters:
      OriginReadTimeout: 180 #service increase requested, we now have 3 min wait available
      WebOrigin: "{{ cloudfront_ssm_params['/config/CKAN/' + Environment + '/app/' + service_name_lower + '/web_loadbalancer_dns_name'] }}"
      CmsOrigin: "{{ CmsOrigin }}"
      WebACLId: "{{ lookup('aws_ssm', '/config/CKAN/' + Environment + '/common/waf_acl_id', region='us-east-1') }}"
      Environment: "{{ Environment }}"
      Platform: "{{ service_name }}"
      ACMCertificateARN: "{{ ACMCertificateARNForUsEast1 }}"
      Domain: "{{ Domain }}"
      LogBucketName: "{{ cloudfront_ssm_params['/config/CKAN/s3LogsBucket'] }}"
      AttachmentBucketName: "{{ cloudfront_ssm_params['/config/CKAN/' + Environment + '/app/' + service_name_lower + '/s3AttachmentBucket'] }}"
      Region: "{{ region }}"
      Service: "{{ service_name }}"
      Division: "{{ Division }}"
      Owner: "{{ Owner }}"
      LambdaAtEdgeViewerRequestVersion: "{{ LambdaAtEdgeViewerRequestVersion }}"
      LambdaAtEdgeOriginRequestVersion: "{{ LambdaAtEdgeOriginRequestVersion }}"
      Version: "1.0"
    tags:
      Environment: "{{ Environment }}"
      Service: "{{ service_name }}"
      Division: "{{ Division }}"
      Owner: "{{ Owner }}"
      Version: "1.0"
