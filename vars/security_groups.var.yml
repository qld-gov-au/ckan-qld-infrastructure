---
cloudformation_stacks:
  - name: "CKAN-{{ Environment }}-SECURITY-GROUPS"
    state: "{{ state | default('present')}}"
    region: "{{ region }}"
    disable_rollback: true
    template: "templates/security_groups.cfn.yml"
    template_parameters:
      BambooAgentIp: "{{ global_ssm_vars['/config/CKAN/cicdIpA'] }}"
      BambooAgentIp2: "{{ global_ssm_vars['/config/CKAN/cicdIpB'] }}"
      BambooAgentSecurityGroup: "{{ global_ssm_vars['/config/CKAN/cicdSecurityGroup'] }}"
      VPCPeeringCidr: "{{ global_ssm_vars['/config/CKAN/opsVpcCidr'] }}"
      Environment: "{{ Environment }}"
      Platform: CKAN
      VPC: "CKANVpc-{{ Environment }}"
    tags:
      Environment: "{{ Environment }}"
      Service: "CKAN"
      Division: "{{ Division }}"
      Owner: "{{ Owner }}"
      Version: "1.0"
