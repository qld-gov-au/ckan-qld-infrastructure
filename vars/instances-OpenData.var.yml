---
ami_id_keys:
  - "{{ ssm_app_prefix }}/BatchAmiId"
  - "{{ ssm_app_prefix }}/WebAmiId"
  - "{{ ssm_app_prefix }}/SolrAmiId"
ami_ids: "{{ lookup('aws_ssm', ami_id_keys) }}"

common_stack: &common_stack
  state: "{{ state | default('present')}}"
  region: "{{ region }}"
  disable_rollback: true
  template: "templates/Datashades-OpsWorks-CKAN-Instances.cfn.yml"
  template_jinja: "templates/Datashades-OpsWorks-CKAN-Instances.cfn.yml.j2"
  template_parameters: &common_stack_template_parameters
    ApplicationName: "{{ service_name }}"
    ApplicationId: "{{ service_name_lower }}"
    AppSubnets: "{{ Environment }}CKANAppSubnet"
    EnableDataStore: "{{ enable_datastore | default('no') }}"
    DefaultEC2Key: "{{ lookup('aws_ssm', '/config/CKAN/ec2KeyPair', region=region) }}"
    WebEC2Size: t4g.medium
    BatchEC2Size: t4g.medium
    BatchImageId: "{{ ami_ids[ssm_app_prefix + '/BatchAmiId'] | default(base_ami, True) }}"
    WebImageId: "{{ ami_ids[ssm_app_prefix + '/WebAmiId'] | default(base_ami, True) }}"
    SolrImageId: "{{ ami_ids[ssm_app_prefix + '/SolrAmiId'] | default(base_ami, True) }}"
  tags: &common_stack_tags
    Environment: "{{ Environment }}"
    Service: "{{ service_name }}"
    Division: "{{ Division }}"
    Owner: "{{ Owner }}"
    Version: "1.0"

cloudformation_stacks:
  - <<: *common_stack
    name: "{{ service_name }}-PROD-OpsWorks-instances"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: PROD
      SolrEC2Size: t4g.medium
      WebEC2Count: 5
    tags:
      <<: *common_stack_tags
      PowerManaged: "No"

  - <<: *common_stack
    name: "{{ service_name }}-STAGING-OpsWorks-instances"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: STAGING
      SolrEC2Size: t4g.medium
    tags:
      <<: *common_stack_tags
      PowerManaged: "Yes"

  - <<: *common_stack
    name: "{{ service_name }}-TRAINING-OpsWorks-instances"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: TRAINING
      WebEC2Size: t4g.small
      SolrEC2Size: t4g.small
      SolrEC2Count: 1
    tags:
      <<: *common_stack_tags
      PowerManaged: "Yes"

  - <<: *common_stack
    name: "{{ service_name }}-DEV-OpsWorks-instances"
    template_parameters:
      <<: *common_stack_template_parameters
      Environment: DEV
      WebEC2Count: 1
      WebEC2Size: t4g.small
      SolrEC2Size: t4g.small
      SolrEC2Count: 1
    tags:
      <<: *common_stack_tags
      PowerManaged: "No"
