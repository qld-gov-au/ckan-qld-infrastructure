---

# This playbook is run after CKAN-Stack & WAF cloudformation stacks.
- name: Cloudformation Playbook
  hosts: local
  connection: local

  pre_tasks:
    - name: Set basic facts
      import_tasks: basic_facts.yml

    - set_fact:
        lambdaAtEdgestack_name: "{{ service_name }}-{{ Environment }}-CLOUDFRONT-LAMBDA-AT-EDGE"
        acm_stack_name: "{{ service_name }}-{{ Environment }}-acm"

    - name: Describe Lambda@Edge cloudformation stack in us-east-1
      cloudformation_info:
        region: "us-east-1"
        stack_name: "{{ lambdaAtEdgestack_name }}"
        stack_resources: true
      register: lambdaAtEdgeStack

    - name: Describe acm cert cloudformation stack in us-east-1
      cloudformation_info:
        region: "us-east-1"
        stack_name: "{{ acm_stack_name }}"
        stack_resources: true
      register: acmUsEast1

    - set_fact:
        LambdaAtEdgeViewerRequestVersion: "{{ lambdaAtEdgeStack['cloudformation'][lambdaAtEdgestack_name].stack_outputs.LambdaEdgeRequestFunctionVersion }}"
        LambdaAtEdgeOriginRequestVersion: "{{ lambdaAtEdgeStack['cloudformation'][lambdaAtEdgestack_name].stack_outputs.LambdaEdgeOriginFunctionVersion }}"
        ACMCertificateARNForUsEast1: "{{ acmUsEast1['cloudformation'][acm_stack_name].stack_outputs.AcmCert }}"

    - include_vars: vars/cloudfront.var.yml
  roles:
    - ansible_cloudformation
