- name: get basic_facts
  set_fact:
    basic_fact={{ item }}
  when: item.Environment == Environment
  with_items: "{{ basic_facts }}"

- name: set facts to environment from basic_fact
  set_fact: "{{ item.key }}={{ item.value }}"
  with_dict: "{{ basic_fact }}"
  when: basic_fact is defined

- name: get global SSM parameters
  shell: |
    aws ssm get-parameters-by-path --path "/config/CKAN/" --no-recursive --with-decryption --region "{{ region }}"
  register: aws_cli_response

- name: set global facts from parameter store
  set_fact:
    global_ssm_vars: "{{ (aws_cli_response.stdout | from_json).Parameters | items2dict(key_name='Name', value_name='Value') }}"

- name: set prefixes for SSM keys
  set_fact:
    ssm_env_prefix: "/config/CKAN/{{ Environment }}"
    ssm_app_prefix: "/config/CKAN/{{ Environment }}/app/{{ service_name_lower }}"

- name: get SSM parameters for environment
  shell: |
    aws ssm get-parameters-by-path --path "/config/CKAN/{{ Environment }}" --recursive --with-decryption --region "{{ region }}"
  register: aws_cli_response

- name: set environment facts from parameter store
  set_fact:
    environment_ssm_vars: "{{ (aws_cli_response.stdout | from_json).Parameters | items2dict(key_name='Name', value_name='Value') }}"
