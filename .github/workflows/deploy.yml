name: "Deploy to AWS"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'DEV'
        type: choice
        options:
          - DEV
          - TEST
          - STAGING
          - PROD
      application:
        description: 'Application to deploy'
        required: true
        type: choice
        options:
          - OpenData
          - Publications
          - CKANTest
      dryRun:
        description: 'Dry Run deployment (set to false to deploy)'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.application }} ${{ github.event.inputs.environment }} Environment
    runs-on: ubuntu-latest
    environment: OpenData-DEV
    env:
      bamboo_deploy_environment: ${{ github.event.inputs.environment }}
    concurrency:
      group: ${{ github.event.inputs.application }}-${{ github.event.inputs.environment }}-deployments
      cancel-in-progress: false

    permissions:
      id-token: write #Needed for AWS role switch
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: ap-southeast-2

      - name: Save root directory
        run: echo "REPO_ROOT=$(pwd)" >> $GITHUB_ENV

      - name: "Deploy ${{ github.event.inputs.application }} to ${{ github.event.inputs.environment }}"
        run: |
          aws iam list-account-aliases | grep osssio-ckan
          greprc=$?
          if [ $greprc -eq 0 ]; then
            ./build-${{ github.event.inputs.application }}.sh
          else
            echo "we are not in ckan account, we did not run script";
            exit 1;
          fi
